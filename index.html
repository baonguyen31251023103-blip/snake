<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Nokia Classic X2 Fixed</title>
    <style>
        body {
            font-family: monospace;
            background-color: #2a2a2a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-viewport {
            border: 6px solid #1a1a1a;
            border-radius: 4px;
            background-color: #79a117;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #score-board {
            font-size: 22px;
            color: #1a1a1a;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 8px;
        }

        .score-box {
            display: flex;
            gap: 20px;
        }

        canvas {
            display: block;
            background-color: #79a117;
            border: 2px solid #1a1a1a;
        }
    </style>
</head>
<body>

    <div id="game-viewport">
        <div id="score-board">
            <span>Rắn</span>
            <div class="score-box">
                <span>Điểm: <span id="score">0</span></span>
                <span>Kỷ lục: <span id="high-score">0</span></span>
            </div>
        </div>
        <canvas id="game-canvas" width="600" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');

        const gridSize = 20; 
        const gridWidth = canvas.width / gridSize;   // 30 ô
        const gridHeight = canvas.height / gridSize; // 20 ô

        let snake = [];
        let food = { x: 0, y: 0 };
        let direction = 'DOWN';
        let nextDirection = 'DOWN';
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isGameOver = false;
        let isStarted = false;

        const BaseSpeed = 150; 
        const bgColor = '#79a117';
        const penColor = '#1a1a1a'; 

        function loadHighScore() {
            const savedHighScore = localStorage.getItem('snake_high_score');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
            } else {
                highScore = 0;
            }
            highScoreElement.innerText = highScore;
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                highScoreElement.innerText = highScore;
                localStorage.setItem('snake_high_score', highScore);
            }
        }

        function drawPixel(x, y) {
            ctx.fillStyle = penColor;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 1, gridSize - 1);
        }

        // Đgradient ĐÃ FIX: Đưa tọa độ rắn về khoảng an toàn ở giữa map (x: 15, y: 5)
        function createSnake() {
            snake = [
                {x: 15, y: 5}, // Đầu
                {x: 15, y: 4}, // Thân
                {x: 15, y: 3}  // Đuôi
            ];
            direction = 'DOWN';
            nextDirection = 'DOWN';
        }

        // Đgradient ĐÃ FIX: Đưa thức ăn ban đầu về vị trí thẳng hàng phía dưới để dễ ăn
        function createFood() {
            food = { x: 15, y: 12 };
        }

        function generateNewFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * (gridWidth - 2)) + 1,
                    y: Math.floor(Math.random() * (gridHeight - 2)) + 1
                };
                valid = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function startTimer() {
            if (gameInterval) clearInterval(gameInterval);
            let currentSpeed = BaseSpeed * Math.pow(0.99, score);
            if (currentSpeed < 40) currentSpeed = 40; 
            gameInterval = setInterval(update, currentSpeed);
        }

        function render() {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawPixel(food.x, food.y);

            for (let part of snake) {
                drawPixel(part.x, part.y);
            }

            if (isGameOver) {
                ctx.fillStyle = penColor;
                ctx.font = "bold 32px monospace";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = "18px monospace";
                ctx.fillText("BẤM PHÍM BẤT KỲ ĐỂ CHƠI LẠI", canvas.width / 2, canvas.height / 2 + 25);
            } else if (!isStarted) {
                ctx.fillStyle = penColor;
                ctx.font = "bold 24px monospace";
                ctx.textAlign = "center";
                ctx.fillText("ẤN PHÍM BẤT KỲ ĐỂ CHƠI", canvas.width / 2, canvas.height / 2);
            }
        }

        function update() {
            if (isGameOver || !isStarted) return;

            direction = nextDirection;
            const head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'UP': head.y--; break;
                case 'DOWN': head.y++; break;
                case 'LEFT': head.x--; break;
                case 'RIGHT': head.x++; break;
            }

            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                endGame();
                return;
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 1; 
                scoreElement.innerText = score;
                updateHighScore();
                generateNewFood();
                startTimer(); 
            } else {
                snake.pop();
            }

            render();
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            updateHighScore();
            render();
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = score;
            isGameOver = false;
            isStarted = false;
            loadHighScore();
            createSnake();
            createFood();
            render();
        }

        // Đgradient ĐÃ TỐI ƯU: Lọc chặn cuộn trang và nhận diện phím chuẩn hơn
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // Chặn không cho cuộn màn hình khi bấm phím mũi tên hoặc Space
            if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }

            if (isGameOver) {
                resetGame();
                return;
            }

            if (!isStarted) {
                isStarted = true;
                startTimer(); 
                return;
            }

            if ((key === 'w' || e.key === 'ArrowUp') && direction !== 'DOWN') nextDirection = 'UP';
            if ((key === 's' || e.key === 'ArrowDown') && direction !== 'UP') nextDirection = 'DOWN';
            if ((key === 'a' || e.key === 'ArrowLeft') && direction !== 'RIGHT') nextDirection = 'LEFT';
            if ((key === 'd' || e.key === 'ArrowRight') && direction !== 'LEFT') nextDirection = 'RIGHT';
        });

        resetGame();
    </script>
</body>
</html>
